<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yu & Cheuk Love App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Styles & Animations */
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-grid {
            background-image: radial-gradient(#bedcfc 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        @keyframes spin-roulette {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(3600deg); }
        }
        .animate-spin-fast {
            animation: spin-roulette 2s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulse-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-pulse-scale {
            animation: pulse-scale 2s ease-in-out infinite;
        }

        /* View Transitions */
        .view-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .view-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateX(20px);
            visibility: hidden;
        }
        .view-active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateX(0);
            visibility: visible;
        }
    </style>
</head>
<body class="bg-[#E3F2FD] text-slate-800 selection:bg-blue-200 overflow-x-hidden min-h-screen relative">
    
    <!-- Background Grid -->
    <div class="fixed inset-0 pointer-events-none opacity-20 z-0">
        <div class="absolute top-1/2 left-1/2 w-full h-full -translate-x-1/2 -translate-y-1/2 bg-grid"></div>
    </div>

    <!-- Main App Container -->
    <div id="app-root" class="relative z-10 max-w-md mx-auto min-h-screen flex flex-col bg-[#E3F2FD]">
        <!-- Loading Screen -->
        <div id="loading-view" class="min-h-screen flex items-center justify-center view-active absolute inset-0 bg-[#E3F2FD] z-50">
            <div class="text-4xl animate-[spin_1s_linear_infinite]">❤️</div>
        </div>
        
        <!-- Views will be injected here -->
        <div id="content-root" class="flex-1 flex flex-col hidden"></div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- Configuration & Constants ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'yu-cheuk-love-app';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const START_DATE = new Date('2025-07-06');
        const YU_BIRTHDAY = new Date('2004-12-20');
        const CHEUK_BIRTHDAY = new Date('2004-12-04');

        const EXPENSE_CATS = ['飲食 🍲', '交通 🚌', '娛樂 🎮', '居住 🏠'];
        const INCOME_CATS = ['人工 💰'];
        const RATES = { JPY: 0.051, KRW: 0.0058, TWD: 0.24, THB: 0.22, GBP: 9.8, AUD: 5.1, HKD: 1 };
        const COUNTRIES = [
            { name: "日本", cities: ["東京", "大阪", "京都", "北海道", "福岡"], currency: "JPY" },
            { name: "韓國", cities: ["首爾", "釜山", "濟州島"], currency: "KRW" },
            { name: "台灣", cities: ["台北", "台中", "台南", "高雄"], currency: "TWD" },
            { name: "泰國", cities: ["曼谷", "清邁", "布吉"], currency: "THB" },
            { name: "英國", cities: ["倫敦", "曼徹斯特"], currency: "GBP" },
            { name: "澳洲", cities: ["悉尼", "墨爾本"], currency: "AUD" }
        ];
        const FOOD_OPTIONS = [
            "譚仔三哥", "壽司郎", "麥當勞", "大快活", "車仔麵", "茶餐廳", "放題", "韓燒", "泰國菜", "越南粉",
            "牛角", "火鍋", "酸菜魚", "漢堡包", "意粉", "點心", "燒鵝飯", "上海菜", "拉麵", "沾麵",
            "沙拉", "素食", "Omakase", "西餐ステーキ", "居酒屋", "串燒", "麻辣燙", "米線", "石磨腸粉", "煲仔飯"
        ];

        // --- Utilities ---
        const calculateDays = (date) => Math.floor((new Date() - new Date(date)) / (1000 * 60 * 60 * 24));
        const generateDates = (start, end) => {
            let arr = []; let curr = new Date(start); let e = new Date(end);
            while(curr <= e) { arr.push(new Date(curr)); curr.setDate(curr.getDate() + 1); }
            return arr;
        };
        const getMockWeather = (dateStr, city) => {
            const emojis = ['☀️ 晴天', '🌧️ 落雨', '⛅ 多雲', '❄️ 落雪', '⛈️ 雷暴'];
            const hash = dateStr.split('').reduce((a, b) => a + b.charCodeAt(0), 0) + city.charCodeAt(0);
            const w = emojis[hash % emojis.length];
            const t = (hash % 15) + 12;
            return `${w} ${t}°C`;
        };

        // --- Global State ---
        window.appState = {
            user: null, // Firebase Auth User
            activeUser: null, // 'Yu' or 'Cheuk'
            view: 'login', // login, dashboard, todo, money, anniversary, eat, travel, travel-detail, settings
            globalSettings: { avatars: { Yu: '🐶', Cheuk: '🦊' } },
            // View Specific States
            todoTab: 'todo',
            todos: [],
            editingTodoId: null,
            moneyTab: 'history', // history, add, piggy
            moneyMonth: new Date().toISOString().substring(0, 7),
            expenses: [],
            piggyLogs: [],
            editingExpense: null,
            travels: [],
            currentTravel: null,
            travelTab: 'itinerary', // itinerary, booking, money, prep
            travelData: { itinerary: [], flights: [], hotels: [], receipts: [], expenses: [], prep: [] },
            travelSelDate: null,
            unsubscribes: [],
            isAdding: false
        };

        // --- Core Functions ---
        const clearListeners = () => {
            window.appState.unsubscribes.forEach(unsub => unsub());
            window.appState.unsubscribes = [];
        };

        window.setView = (view, extraData = null) => {
            window.appState.view = view;
            window.appState.isAdding = false;
            if (view === 'travel-detail' && extraData) {
                window.appState.currentTravel = extraData;
                window.appState.travelTab = 'itinerary';
                window.appState.travelSelDate = extraData.startDate;
                setupTravelDetailListeners(extraData.id);
            }
            if (view !== 'travel-detail') {
                window.appState.currentTravel = null;
            }
            render();
        };

        const render = () => {
            const root = document.getElementById('content-root');
            root.classList.remove('hidden');
            document.getElementById('loading-view').classList.add('hidden');
            
            let html = '';
            switch(window.appState.view) {
                case 'login': html = renderLoginView(); break;
                case 'dashboard': html = renderDashboardView(); break;
                case 'todo': html = renderTodoView(); break;
                case 'money': html = renderMoneyView(); break;
                case 'anniversary': html = renderAnniversaryView(); break;
                case 'eat': html = renderEatView(); break;
                case 'travel': html = renderTravelListView(); break;
                case 'travel-detail': html = renderTravelDetailView(); break;
                case 'settings': html = renderSettingsView(); break;
            }
            
            root.innerHTML = `<div class="view-active flex-1 flex flex-col h-full">${html}</div>`;
            lucide.createIcons(); // Re-initialize icons
        };

        // --- Auth & Init ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth error:", err); }
        };

        onAuthStateChanged(auth, (u) => {
            window.appState.user = u;
            if (u) {
                // Setup Global Listeners
                const settingsDoc = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
                onSnapshot(settingsDoc, (snapshot) => {
                    if (snapshot.exists()) {
                        window.appState.globalSettings = snapshot.data();
                        if(window.appState.view !== 'login') render(); // re-render if avatars changed
                    }
                });
                
                // Data Listeners
                setupDataListeners();
            }
            if(window.appState.view === 'login') render();
        });

        const setupDataListeners = () => {
            clearListeners();
            // Todos
            window.appState.unsubscribes.push(
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'todos'), snap => {
                    window.appState.todos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(window.appState.view === 'todo') render();
                })
            );
            // Expenses
            window.appState.unsubscribes.push(
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), snap => {
                    window.appState.expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(window.appState.view === 'money') render();
                })
            );
            // Piggy
            window.appState.unsubscribes.push(
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'piggy'), snap => {
                    window.appState.piggyLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(window.appState.view === 'money' && window.appState.moneyTab === 'piggy') render();
                })
            );
            // Travels
            window.appState.unsubscribes.push(
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'travels'), snap => {
                    window.appState.travels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(window.appState.view === 'travel') render();
                })
            );
        };

        const setupTravelDetailListeners = (tid) => {
            const base = `artifacts/${appId}/public/data/travels/${tid}`;
            ['itinerary', 'flights', 'hotels', 'receipts', 'expenses', 'prep'].forEach(col => {
                onSnapshot(collection(db, base, col), snap => {
                    window.appState.travelData[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(window.appState.view === 'travel-detail') render();
                });
            });
        };

        initAuth();

        // --- Action Handlers (Globally exposed) ---
        window.actions = {
            login: (name) => { window.appState.activeUser = name; window.setView('dashboard'); },
            
            // Todo
            setTodoTab: (tab) => { window.appState.todoTab = tab; render(); },
            addTodo: async () => {
                const input = document.getElementById('todo-input').value;
                if(!input.trim()) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'todos'), { text: input, type: window.appState.todoTab, creator: window.appState.activeUser, done: false, createdAt: serverTimestamp() });
                document.getElementById('todo-input').value = '';
            },
            toggleTodo: async (id, done) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id), { done }); },
            delTodo: async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id)); },
            startEditTodo: (id) => { window.appState.editingTodoId = id; render(); },
            cancelEditTodo: () => { window.appState.editingTodoId = null; render(); },
            saveEditTodo: async (id) => {
                const val = document.getElementById(`edit-todo-${id}`).value;
                if(!val.trim()) return;
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'todos', id), { text: val });
                window.appState.editingTodoId = null;
            },

            // Money
            setMoneyTab: (tab) => { window.appState.moneyTab = tab; window.appState.editingExpense = null; render(); },
            setMoneyMonth: (e) => { window.appState.moneyMonth = e.target.value; render(); },
            saveExpense: async (type) => {
                const amount = document.getElementById('exp-amount').value;
                const cat = document.getElementById('exp-cat').value;
                const note = document.getElementById('exp-note').value;
                if(!amount) return;
                
                const data = { type, amount: parseFloat(amount), cat, note, payer: window.appState.activeUser };
                if (window.appState.editingExpense) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', window.appState.editingExpense.id), data);
                } else {
                    data.date = new Date().toISOString();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), data);
                }
                window.appState.moneyTab = 'history'; render();
            },
            editExpense: (id) => { window.appState.editingExpense = window.appState.expenses.find(e => e.id === id); window.appState.moneyTab = 'add'; render(); },
            delExpense: async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id)); },
            addPiggy: async (type) => {
                const amt = document.getElementById('piggy-amount').value;
                if(!amt) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'piggy'), { type, amount: parseFloat(amt), user: window.appState.activeUser, date: new Date().toISOString() });
            },
            delPiggy: async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'piggy', id)); },

            // Eat
            spinEat: () => {
                const el = document.getElementById('eat-wheel');
                const resultEl = document.getElementById('eat-result');
                el.classList.add('animate-spin-fast');
                el.innerHTML = '🎡';
                resultEl.innerHTML = '';
                setTimeout(() => {
                    el.classList.remove('animate-spin-fast');
                    el.innerHTML = '✨';
                    const res = FOOD_OPTIONS[Math.floor(Math.random() * FOOD_OPTIONS.length)];
                    resultEl.innerHTML = `<p class="text-xs font-bold text-slate-400">決定咗啦！就食</p><h3 class="text-4xl font-black text-blue-500 mt-2">${res}</h3>`;
                }, 2000);
            },

            // Travel List
            toggleAddTravel: (state) => { window.appState.isAdding = state; render(); },
            updateCountryForm: (e) => {
                const cName = e.target.value;
                const country = COUNTRIES.find(c => c.name === cName);
                const citySelect = document.getElementById('t-city');
                citySelect.innerHTML = country.cities.map(c => `<option value="${c}">${c}</option>`).join('');
                citySelect.dataset.currency = country.currency;
            },
            saveTravel: async () => {
                const title = document.getElementById('t-title').value;
                const startDate = document.getElementById('t-start').value;
                const endDate = document.getElementById('t-end').value;
                const country = document.getElementById('t-country').value;
                const city = document.getElementById('t-city').value;
                const currency = document.getElementById('t-city').dataset.currency || 'JPY';
                if(!title || !startDate || !endDate) return alert('請填寫完整資料');
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels'), { title, startDate, endDate, country, city, currency, createdAt: serverTimestamp() });
                window.appState.isAdding = false; render();
            },
            delTravel: async (id, e) => { e.stopPropagation(); await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'travels', id)); },

            // Travel Detail Actions
            setTravelTab: (t) => { window.appState.travelTab = t; window.appState.isAdding = false; render(); },
            setTravelDate: (d) => { window.appState.travelSelDate = d; render(); },
            toggleAddItin: (s) => { window.appState.isAdding = s; render(); },
            addItin: async () => {
                const time = document.getElementById('i-time').value;
                const place = document.getElementById('i-place').value;
                const cat = document.getElementById('i-cat').value;
                const note = document.getElementById('i-note').value;
                if(!place) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'itinerary'), { time, place, cat, note, date: window.appState.travelSelDate });
                window.appState.isAdding = false; render();
            },
            delItin: async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'itinerary', id)); },
            
            // Travel Bookings
            toggleAddSection: (sec, s) => { window.appState.isAdding = s; window.appState.addSection = sec; render(); },
            addFlight: async () => {
                const f = { no: document.getElementById('f-no').value, from: document.getElementById('f-from').value, to: document.getElementById('f-to').value, time: document.getElementById('f-time').value, gate: document.getElementById('f-gate').value };
                if(!f.no) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'flights'), f);
                window.appState.isAdding = false; render();
            },
            addHotel: async () => {
                const h = { name: document.getElementById('h-name').value, checkIn: document.getElementById('h-in').value, checkOut: document.getElementById('h-out').value, phone: document.getElementById('h-phone').value, address: document.getElementById('h-add').value, fileName: document.getElementById('h-file').files[0]?.name || '' };
                if(!h.name) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'hotels'), h);
                window.appState.isAdding = false; render();
            },
            addReceipt: async () => {
                const r = { title: document.getElementById('r-title').value, fileName: document.getElementById('r-file').files[0]?.name || '' };
                if(!r.title) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'receipts'), r);
                window.appState.isAdding = false; render();
            },
            delDoc: async (col, id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, col, id)); },

            // Travel Money
            calcRate: () => {
                const v = document.getElementById('rate-in').value;
                const r = RATES[window.appState.currentTravel.currency || 'JPY'] || 1;
                document.getElementById('rate-out').innerText = `HKD ${(Number(v)*r).toFixed(2)}`;
            },
            addTravelExp: async () => {
                const amt = document.getElementById('te-amt').value;
                const cat = document.getElementById('te-cat').value;
                const note = document.getElementById('te-note').value;
                if(!amt) return;
                const r = RATES[window.appState.currentTravel.currency || 'JPY'] || 1;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'expenses'), { amount: Number(amt), cat, note, payer: window.appState.activeUser, hkd: (Number(amt)*r).toFixed(2), createdAt: serverTimestamp() });
                window.appState.isAdding = false; render();
            },

            // Travel Prep
            setPrepTab: (tab) => { window.appState.prepTab = tab; render(); },
            addPrep: async () => {
                const v = document.getElementById('prep-in').value;
                if(!v) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'prep'), { text: v, type: window.appState.prepTab || 'todo', creator: window.appState.activeUser, done: false, createdAt: serverTimestamp() });
            },
            togglePrep: async (id, done) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'travels', window.appState.currentTravel.id, 'prep', id), { done }); },

            // Settings
            saveSettings: async () => {
                const yu = document.getElementById('set-yu').value || '🐶';
                const cheuk = document.getElementById('set-cheuk').value || '🦊';
                const newSettings = { ...window.appState.globalSettings, avatars: { Yu: yu, Cheuk: cheuk } };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), newSettings);
                window.appState.globalSettings = newSettings;
                window.setView('dashboard');
            }
        };

        // --- View Renderers ---
        function renderLoginView() {
            const av = window.appState.globalSettings.avatars;
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center h-full">
                    <div class="text-7xl mb-12 animate-float">❤️</div>
                    <div class="grid grid-cols-2 gap-8 w-full">
                        ${['Yu', 'Cheuk'].map(name => `
                            <button onclick="actions.login('${name}')" class="bg-white border-4 border-slate-800 p-8 rounded-[40px] shadow-[8px_8px_0px_0px_rgba(30,41,59,1)] flex flex-col items-center gap-4 active:scale-95 transition-transform">
                                <span class="text-6xl">${av[name] || (name==='Yu'?'🐶':'🦊')}</span>
                                <span class="font-black text-xl">${name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderDashboardView() {
            const user = window.appState.activeUser;
            const av = window.appState.globalSettings.avatars;
            const days = calculateDays(START_DATE);
            
            return `
                <div class="p-6">
                    <div class="flex justify-between items-center mb-8">
                        <div class="flex items-center gap-3">
                            <div class="text-3xl bg-white p-2 rounded-2xl border-2 border-slate-800">${av[user]}</div>
                            <h2 class="font-black text-lg">嗨，${user}！今日點啊？</h2>
                        </div>
                        <button onclick="setView('settings')" class="p-3 bg-white border-4 border-slate-800 rounded-2xl shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] active:scale-95 transition-transform"><i data-lucide="settings" width="20"></i></button>
                    </div>

                    <div class="bg-white border-4 border-slate-800 rounded-[32px] p-8 mb-8 shadow-[10px_10px_0px_0px_rgba(30,41,59,1)] text-center relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-pink-300"></div>
                        <p class="text-slate-400 font-bold text-sm mb-2">我哋已經一齊咗</p>
                        <div class="text-6xl font-black text-pink-500 mb-2">${days} <span class="text-xl text-slate-800">日</span></div>
                        <p class="text-[10px] font-bold text-slate-300">SINCE 2025.07.06 🍯</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        ${renderDashCard('todo', 'CheckCircle2', 'To-Do List', '代辦事項', 'bg-green-100')}
                        ${renderDashCard('money', 'Wallet', '記帳', 'Money', 'bg-amber-100')}
                        ${renderDashCard('anniversary', 'Heart', '紀念日', 'Anniversary', 'bg-red-100')}
                        ${renderDashCard('eat', 'Utensils', '食乜好', 'Eat Wheel', 'bg-orange-100')}

        function renderAnniversaryView() {
            const list = [];
            const today = new Date();
            const startYear = START_DATE.getFullYear();
            const curYear = today.getFullYear();
            
            for (let i = 0; i <= 10; i++) {
                const targetYear = startYear + i;
                if (i > 0) list.push({ name: `${i}週年紀念日`, date: new Date(targetYear, 6, 6), icon: ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'][i-1] || '💖' });
                
                const vDate = new Date(targetYear, 1, 14);
                if (vDate > START_DATE) list.push({ name: `我哋第${targetYear - startYear + (START_DATE.getMonth() < 1 ? 1 : 0)}個情人節`, date: vDate, icon: '🌹' });
                
                const xDate = new Date(targetYear, 11, 25);
                if (xDate > START_DATE) list.push({ name: `我哋第${targetYear - startYear + (START_DATE.getMonth() < 11 ? 1 : 0)}個聖誕節`, date: xDate, icon: '🎄' });
                
                const fDate = new Date(targetYear, 4, 20);
                if (fDate > START_DATE) {
                    let nth = targetYear - startYear + (START_DATE.getMonth() < 4 ? 1 : 0);
                    list.push({ name: nth === 1 ? '1st 520' : `${nth}th 520`, date: fDate, icon: '💘' });
                }
                
                list.push({ name: `Yu ${targetYear - 2004}歲生日🎂`, date: new Date(targetYear, 11, 20), icon: '🎂' });
                list.push({ name: `Cheuk ${targetYear - 2004}歲生日🎂`, date: new Date(targetYear, 11, 4), icon: '🎂' });
            }

            list.sort((a, b) => a.date - b.date);
            const past = list.filter(e => e.date < new Date(today.getFullYear(), today.getMonth(), today.getDate())).reverse();
            const future = list.filter(e => e.date >= new Date(today.getFullYear(), today.getMonth(), today.getDate()));

            return `

                                <input type="hidden" id="te-cat" value="${window._tempTrvExpCat}">
                                ${EXPENSE_CATS.map(c => `
                                    <button onclick="window._tempTrvExpCat='${c}'; render();" class="px-3 py-1 text-[10px] border-2 border-slate-800 rounded-full font-bold ${window._tempTrvExpCat === c ? 'bg-yellow-300' : 'bg-white'}">${c}</button>
                                `).join('')}
                            </div>
                            <input id="te-note" placeholder="買咗咩？" class="w-full p-2 border-2 border-slate-200 rounded-lg text-sm font-bold outline-none" />
                            <div class="flex gap-2">
                                <button onclick="actions.toggleAddSection(null, false)" class="flex-1 py-2 bg-slate-100 rounded-lg font-bold text-xs">取消</button>
                                <button onclick="actions.addTravelExp()" class="flex-1 py-2 bg-slate-800 text-white rounded-lg font-bold text-xs">記低佢</button>
                            </div>
                        </div>
                    ` : ''}

                    <div class="space-y-3">
                        ${expenses.map(e => `
                            <div class="bg-white p-4 rounded-2xl border-2 border-slate-200 flex justify-between items-center shadow-sm">
                                <div class="flex items-center gap-3">
                                    <span class="text-2xl">${av[e.payer]}</span>
                                    <div>
                                        <div class="font-black text-sm">${e.note || e.cat}</div>
                                        <div class="text-[10px] text-slate-400">${e.cat}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="font-black text-lg">${e.amount} <span class="text-[10px]">${currency}</span></div>
                                    <div class="text-[10px] text-green-500 font-bold">≈ $${e.hkd}</div>
                                </div>
                                <button onclick="actions.delDoc('expenses', '${e.id}')" class="text-slate-300 ml-2"><i data-lucide="trash-2" width="14"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTravelPrep(travel) {
            const tab = window.appState.prepTab || 'todo';
            const items = window.appState.travelData.prep.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            const listItems = items.filter(i => i.type === tab);
            const pending = listItems.filter(i => !i.done);
            const completed = listItems.filter(i => i.done);
            const av = window.appState.globalSettings.avatars;

            const tabs = [{id:'todo', l:'必做'}, {id:'bag', l:'行李'}, {id:'shop', l:'購物'}];

            return `
                <div class="p-6 h-full flex flex-col pb-20 no-scrollbar">
                    <div class="flex bg-white p-1 rounded-xl border-2 border-slate-300 mb-6 flex-shrink-0">
                        ${tabs.map(t => `
                            <button onclick="actions.setPrepTab('${t.id}')" class="flex-1 py-2 rounded-lg font-black text-xs transition-colors ${tab === t.id ? 'bg-blue-400 text-white' : 'text-slate-500'}">
                                ${t.l}
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex gap-2 mb-6 flex-shrink-0">
                        <input id="prep-in" placeholder="${tab === 'shop' ? '想買咩？' : '加啲嘢入清單...'}" class="flex-1 p-3 border-2 border-slate-300 rounded-xl font-bold text-sm bg-white outline-none" />
                        <button onclick="actions.addPrep()" class="bg-slate-800 text-white p-3 rounded-xl active:scale-95"><i data-lucide="plus" width="18"></i></button>
                    </div>

                    <div class="flex-1 overflow-y-auto space-y-6 pr-1 no-scrollbar">
                        <div>
                            <h4 class="font-black text-xs text-slate-400 mb-3">${tab === 'shop' ? '想買嘅嘢 💭' : '未搞掂 ⏳'}</h4>
                            <div class="space-y-2">
                                ${pending.map(i => `
                                    <div class="bg-white border-2 border-slate-800 p-3 rounded-xl shadow-sm flex items-center justify-between">
                                        <div class="flex items-center gap-3">
                                            <button onclick="actions.togglePrep('${i.id}', true)" class="w-5 h-5 border-2 border-slate-800 rounded flex items-center justify-center bg-white"></button>
                                            <span class="font-bold text-sm">${i.text}</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-sm">${av[i.creator]}</span>
                                            <button onclick="actions.delDoc('prep', '${i.id}')" class="text-slate-300"><i data-lucide="trash-2" width="14"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                                ${pending.length === 0 ? `<div class="text-xs text-slate-400 font-bold">全部清空！叻仔叻女！✨</div>` : ''}
                            </div>
                        </div>

                        ${completed.length > 0 ? `
                            <div>
                                <h4 class="font-black text-xs text-slate-400 mb-3">${tab === 'shop' ? '買咗啦！🛍️' : '搞掂晒 ✅'}</h4>
                                <div class="space-y-2 opacity-60">
                                    ${completed.map(i => `
                                        <div class="bg-slate-100 border-2 border-slate-300 p-3 rounded-xl flex items-center justify-between">
                                            <div class="flex items-center gap-3">
                                                <button onclick="actions.togglePrep('${i.id}', false)" class="w-5 h-5 border-2 border-slate-400 rounded flex items-center justify-center bg-green-400"><i data-lucide="check" width="12" class="text-white"></i></button>
                                                <span class="font-bold text-sm line-through text-slate-500">${i.text}</span>
                                            </div>
                                            <button onclick="actions.delDoc('prep', '${i.id}')" class="text-slate-400"><i data-lucide="trash-2" width="14"></i></button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderSettingsView() {
            const av = window.appState.globalSettings.avatars;
            return `
                <div class="p-6 h-full flex flex-col">
                    <div class="flex items-center gap-4 mb-10">
                        <button onclick="setView('dashboard')" class="p-2 bg-white border-2 border-slate-800 rounded-full"><i data-lucide="arrow-left"></i></button>
                        <h2 class="text-2xl font-black">設定 ⚙️</h2>
                    </div>

                    <div class="bg-white border-4 border-slate-800 p-8 rounded-[40px] shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] space-y-8">
                        <div>
                            <label class="text-xs font-black text-slate-400 uppercase mb-4 block">更改頭像 Emoji</label>
                            <div class="grid grid-cols-2 gap-4">
                                ${['Yu', 'Cheuk'].map(n => `
                                    <div class="flex flex-col items-center gap-2">
                                        <span class="text-xs font-bold">${n}</span>
                                        <input id="set-${n.toLowerCase()}" value="${av[n]}" class="w-full text-center text-4xl p-4 bg-slate-50 rounded-2xl border-4 border-slate-800 outline-none" />
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <button onclick="actions.saveSettings()" class="w-full py-5 bg-slate-800 text-white rounded-[24px] font-black text-xl shadow-[6px_6px_0px_0px_rgba(30,41,59,0.3)] flex items-center justify-center gap-2 active:scale-95 transition-transform">
                            <i data-lucide="save" width="20"></i> 儲存設定
                        </button>
                    </div>

                    <button onclick="window.location.reload()" class="mt-auto p-4 text-red-500 font-black flex items-center justify-center gap-2"><i data-lucide="log-out" width="18"></i> 登出 / 重新整理</button>
                </div>
            `;
        }

    </script>
</body>
</html>
